[package]
name = "hammerhead"
version = "0.1.0"
description = "A native desktop client for Sharkord"
authors = ["martintondel02"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "hammerhead_lib"
crate-type = ["staticlib", "cdylib", "rlib"]