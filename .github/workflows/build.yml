name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build (Fedora, debug + RPM)
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y git cargo rustup webkit2gtk4.1-devel openssl-devel \
            dbus-devel pkgconf-pkg-config libappindicator-gtk3-devel librsvg2-devel

      - name: Build
        working-directory: src-tauri
        run: cargo build --verbose

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Build release
        working-directory: src-tauri
        run: cargo build --release --verbose

      - name: Build RPM via cargo-generate-rpm
        working-directory: src-tauri
        run: |
          cargo install cargo-generate-rpm --locked || true
          ~/.cargo/bin/cargo generate-rpm 2>/dev/null || echo "RPM packaging via cargo-generate-rpm requires extra config; skipped"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hammerhead-linux-binary
          path: src-tauri/target/release/hammerhead
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          dnf install -y git flatpak flatpak-builder python3-pip
          pip install --user tomlkit pyyaml aiohttp
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - name: Regenerate cargo sources
        run: |
          curl -sL https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py -o /tmp/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py src-tauri/Cargo.lock -o build-aux/cargo-sources.json

      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir build-aux/io.github.martintondel02.hammerhead.json

      - name: Build bundle
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          flatpak build-bundle repo Hammerhead-${VERSION}.x86_64.flatpak io.github.martintondel02.hammerhead

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: hammerhead-flatpak
          path: Hammerhead-*.x86_64.flatpak
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/hammerhead-flatpak/*.flatpak
            artifacts/hammerhead-linux-binary/hammerhead